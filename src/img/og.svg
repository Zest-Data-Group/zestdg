<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og.png. Regenerate with: npm run og -->
  <rect width="1200" height="630" fill="#FAF0E6"/>
  <rect x="0" y="0" width="1200" height="14" fill="#F1A104"/>
  <g transform="translate(40,105) scale(0.95)">
<defs>
    <clipPath id="ogwedge"><path d="M 320 240 L 452 240 A 132 132 0 0 1 320 372 Z"/></clipPath>
  </defs>
  <!-- trailing bands, back to front: navy, blue, orange. Ends tuck behind the fruit. -->
  <g fill="none" stroke-linecap="round" stroke-width="32">
    <path d="M 44 336 C 140 336, 210 306, 320 292" stroke="#192E5B"/>
    <path d="M 26 280 C 126 280, 200 254, 320 248" stroke="#1E65A7"/>
    <path d="M 52 224 C 136 224, 206 204, 320 206" stroke="#F1A104"/>
  </g>
  <!-- cut face: pale flesh, three segments separated by pith, all clipped to the missing quarter -->
  <g clip-path="url(#ogwedge)">
    <circle cx="320" cy="240" r="120" fill="#EEF6D2"/>
    <circle cx="320" cy="240" r="110" fill="none" stroke="#FAF0E6" stroke-width="14"/>
    <g stroke="#FAF0E6" stroke-width="12" stroke-linecap="round">
      <path d="M 320 240 L 470 240"/>
      <path d="M 320 240 L 426 346"/>
      <path d="M 320 240 L 320 390"/>
    </g>
    <g stroke="#8DC26F" stroke-width="5" stroke-linecap="round" opacity="0.9">
      <path d="M 320 240 L 436 271"/>
      <path d="M 320 240 L 351 356"/>
    </g>
  </g>
  <!-- rind: three quarters, bold outline -->
  <path d="M 320 240 L 440 240 A 120 120 0 1 0 320 360 Z" fill="#00743F" stroke="#122B20" stroke-width="14" stroke-linejoin="round"/>
  <!-- outer edge of the cut face, so the quarter reads as part of the fruit -->
  <path d="M 440 240 A 120 120 0 0 1 320 360" fill="none" stroke="#122B20" stroke-width="10" stroke-linecap="round"/>
  <!-- stem and two leaves -->
  <g stroke="#122B20" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 320 122 L 320 92"/>
    <path d="M 320 96 C 286 96, 244 74, 228 36 C 272 30, 314 54, 320 96 Z" fill="#25B396"/>
    <path d="M 322 96 C 354 92, 396 66, 410 30 C 370 28, 332 54, 322 96 Z" fill="#00743F"/>
  </g>

  </g>
  <g font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" fill="#122B20">
    <text x="530" y="270" font-size="72" font-weight="600" letter-spacing="-1">Zest Data Group</text>
    <text x="530" y="352" font-size="42" fill="#00743F">Fast and fresh data analysis.</text>
    <text x="530" y="432" font-size="27" fill="#122B20" opacity="0.72">Geospatial analysis · R development</text>
    <text x="530" y="472" font-size="27" fill="#122B20" opacity="0.72">Reproducible research workflows</text>
    <text x="530" y="548" font-size="26" fill="#00743F" letter-spacing="1">zestdg.com</text>
  </g>
</svg>
